name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job starts from a fresh checkout and `npm ci`. The quality job proves
# install + unit tests + coverage; the build job proves the production build.
# Together they are the fresh-clone verification, and they run on every push.
jobs:
  quality:
    name: Unit gates — format, lint, typecheck, coverage (no database)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the lockfile is in sync
        run: git diff --exit-code -- package-lock.json

      - name: Check environment variable documentation
        run: npm run check:env

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit suites with coverage gates (no database)
        run: npm run test:coverage

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            server/coverage
            client/coverage
            server/junit.xml
            client/junit.xml
          retention-days: 7

      # The deepmerge-ts advisory is pinned forward via the root `overrides`
      # block, so production dependencies must stay clean. This step is blocking.
      - name: Dependency audit
        run: npm run audit

  build:
    name: Build — API and storefront
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  integration:
    name: Integration — real MySQL specs and API smoke test
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aurora_commerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/aurora_commerce
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CLIENT_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: warn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Seed the database
        run: npm run seed

      - name: Run the database integration specs
        run: npm run test:integration

      - name: Upload the integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: server/junit-integration.xml
          retention-days: 7

      - name: Boot the API and wait for health
        run: |
          npm run start:server &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:4000/api/health; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

  docker:
    name: Docker — build both images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: aurora-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build storefront image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: aurora-storefront:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
